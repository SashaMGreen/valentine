<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Content-Language" content="en" />
<meta name="google" content="notranslate" />
<title>For Nikki ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@1&family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="fadeOverlay"></div>

<!-- global audio (no autoplay) -->
<audio id="bgMusic" preload="auto">
  <source src="assets/Gypsy.mp3" type="audio/mpeg">
</audio>

<!-- ================= HOME ================= -->
<section id="home" class="page active">
  <div class="frame" data-target="recordPage">
    <img src="assets/frame.png" class="frame-img" alt="frame">
     <img src="assets/record-player.png" alt="Record Player" class="frame-image record-player">
    <div class="number">1</div>
  </div>

  <div class="frame" data-target="typePage">
    <img src="assets/frame.png" class="frame-img" alt="frame">
    <img src="assets/typewriter.png" alt="Typewriter" class="frame-image typewriter">
    <div class="number">2</div>
  </div>

  <div class="frame" data-target="thirdPage">
    <img src="assets/frame.png" class="frame-img" alt="frame">
    <img src="assets/bottle.png" alt="Bottle" class="frame-image bottle">
    <div class="number">3</div>
  </div>

  <!-- only appears after visiting the three pages -->
  <button id="finalContinue" class="continue hidden">Continue</button>
</section>

<!-- ================= RECORD PAGE ================= -->
<section id="recordPage" class="page">
  <video class="bg-video" muted playsinline preload="auto">
    <source src="assets/record-transition.mp4" type="video/mp4">
  </video>

  <!-- record positioned at exact bottom middle -->
  <div class="record-container">
    <p class="caption" style="--caption-color: white; --caption-bottom: 400px; --caption-left: 40%;">Make sure your volume is up and turn the record player on!</p>
    <img src="assets/record-player.png" id="recordPlayer" alt="record player">
  </div>

  <button class="continue">Continue</button>
</section>

<!-- ================= TYPEWRITER PAGE ================= -->
<section id="typePage" class="page">
  <video class="bg-video" muted playsinline preload="auto">
    <source src="assets/type-transition.mp4" type="video/mp4">
  </video>

  <!-- typewriter slightly below viewport (cropped) -->
  <div class="type-container">
    <p class="caption" style="--caption-color: black; --caption-bottom: 525px; --caption-left: 50%;">Looks like there was a paper left on the typewriter. Maybe you should read it?</p>
    <img src="assets/typewriter.png" id="typewriter" alt="typewriter">
  </div>

  <!-- letter pops in centered above everything -->
  <img src="assets/letter-paper.jpg" id="letter" class="hidden" alt="letter">

  <button class="continue">Continue</button>
</section>

<!-- ================= THIRD PAGE ================= -->
<section id="thirdPage" class="page">
  <video class="bg-video" muted playsinline preload="auto">
    <source src="assets/third-transition.mp4" type="video/mp4">
  </video>

  <div class="third-container">
    <!-- small bottle bottom-left (not completely at edge) -->
    <img src="assets/bottle.png" id="bottle" alt="bottle">

    <!-- bottle-letter replaces bottle after second click -->
    <img src="assets/bottle-letter.png" id="bottleLetter" class="hidden" alt="bottle letter">

    <!-- caption bottom-middle -->
    <p class="caption" id="thirdCaption" style="--caption-color: black; --caption-bottom: 120px; --caption-left: 50%;">
      Looks like someone lost some kind of bottle. . . would you mind fetching it?
    </p>

    <!-- stacked letters; initially hidden -->
    <div id="lettersRow" class="hidden">
      <img src="assets/letter1.png" class="stackLetter" alt="letter 1">
      <img src="assets/letter2.png" class="stackLetter" alt="letter 2">
      <img src="assets/letter3.png" class="stackLetter" alt="letter 3">
      <img src="assets/letter4.png" class="stackLetter" alt="letter 4">
    </div>
  </div>

  <button class="continue">Continue</button>
</section>

<!-- ================= FOURTH PAGE (valentine) ================= -->
<section id="valentinePage" class="page">
  <div class="valentine-container">

    <!-- success caption (hidden until YES) -->
    <p class="valentine-caption" id="valentineTopText"></p>

    <div class="valentine-characters">

      <!-- SASHA (LEFT) -->
      <div class="valentine-character left">
        <div class="paper-box left-box">
          <img src="assets/paper-box.png" alt="">
          <p>be my valentine?</p>
        </div>

        <img id="sashaImg" src="assets/sasha-smile.png" alt="sasha">
      </div>

      <!-- NIKKI (RIGHT) -->
      <div class="valentine-character right">
        <img id="nikkiImg" src="assets/nikki-smile.png" alt="nikki">

        <div class="paper-buttons">
          <button id="yesBtn" class="paper-btn yes">
            <img src="assets/paper-box.png" alt="">
            <span>yes!!</span>
          </button>

          <button id="noBtn" class="paper-btn no">
            <img src="assets/paper-box.png" alt="">
            <span>no... :(</span>
          </button>
        </div>
      </div>

    </div>
  </div>
</section>

<script src="script.js"></script>
</body>
</html>
