<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Language" content="en">
<meta name="google" content="notranslate">
<title>For Nikki ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@1&family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="fadeOverlay"></div>

<audio id="bgMusic" preload="auto">
  <source src="assets/little-lies.mp3" type="audio/mpeg">
</audio>

<!-- ================= HOME ================= -->
<section id="home" class="page active">

  <div class="frame" data-target="recordPage">
    <img src="assets/frame.png" class="frame-img">
    <img src="assets/record-player.png" class="frame-content">
    <div class="number">1</div>
  </div>

  <div class="frame" data-target="typePage">
    <img src="assets/frame.png" class="frame-img">
    <img src="assets/typewriter.png" class="frame-content">
    <div class="number">2</div>
  </div>

  <div class="frame" data-target="thirdPage">
    <img src="assets/frame.png" class="frame-img">
    <img src="assets/third.png" class="frame-content">
    <div class="number">3</div>
  </div>

  <!-- NEW BUTTON (hidden initially) -->
  <button id="finalContinue" class="continue hidden">
    Continue
  </button>

</section>

<!-- ================= RECORD PAGE ================= -->
<section id="recordPage" class="page">
  <video class="bg-video" muted playsinline preload="auto">
    <source src="assets/record-transition.mp4" type="video/mp4">
  </video>

  <div class="record-container">
    <img src="assets/record-player.png" id="recordPlayer">
    <p class="caption">Turn on the record player.</p>
  </div>

  <button class="continue">Continue</button>
</section>

<!-- ================= TYPEWRITER PAGE ================= -->
<section id="typePage" class="page">
  <video class="bg-video" muted playsinline preload="auto">
    <source src="assets/type-transition.mp4" type="video/mp4">
  </video>

  <div class="type-container">
    <img src="assets/typewriter.png" id="typewriter">
    <p class="caption">Read the paper on the typewriter.</p>
  </div>

  <img src="assets/letter-paper.jpg" id="letter" class="hidden">

  <button class="continue">Continue</button>
</section>

<!-- ================= THIRD PAGE ================= -->
<section id="thirdPage" class="page">
  <video class="bg-video" muted playsinline preload="auto">
    <source src="assets/third-transition.mp4" type="video/mp4">
  </video>

  <div class="third-container">
    <img src="assets/bottle.png" id="bottle">
    <img src="assets/bottle-letter.png" id="bottleLetter" class="hidden">

    <div id="lettersRow" class="hidden">
      <img src="assets/letter1.png" class="stackLetter">
      <img src="assets/letter2.png" class="stackLetter">
      <img src="assets/letter3.png" class="stackLetter">
      <img src="assets/letter4.png" class="stackLetter">
    </div>
  </div>

  <button class="continue">Continue</button>
</section>

<!-- ================= FOURTH PAGE ================= -->
<section id="valentinePage" class="page">

  <div class="valentine-container">

    <div class="valentine-text" id="valentineTopText"></div>

    <!-- Sasha (Left) -->
    <div class="character left">
      <img id="sashaImg" src="assets/sasha-smile.png">
      <div class="paper-box">
        <img src="assets/paper-box.png">
        <p>be my valentine?</p>
      </div>
    </div>

    <!-- Nikki (Right) -->
    <div class="character right">
      <img id="nikkiImg" src="assets/nikki-smile.png">

      <div class="response-buttons">
        <button id="yesBtn">yes!!</button>
        <button id="noBtn">no... :(</button>
      </div>
    </div>

  </div>

</section>

<script src="script.js"></script>
</body>
</html>
